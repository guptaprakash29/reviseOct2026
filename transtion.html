<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #box {
        width: 150px;
        height: 150px;
        background-color: black;
        border: 1px ridge red;
        border-radius: 5px;
        position: relative;
        top: 200px;
        left: 200px;
      }
      #box:hover {
        background-color: #2ecc71; /* change background on hover */
        transform: scale(1.2); /* grow button */
      }
    </style>
  </head>
  <body>
    <div id="box"></div>
  </body>
</html>
