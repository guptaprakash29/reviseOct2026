<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #container {
        display: flex;
      }
      #containt1 {
        width: 250px;
        height: 250px;
        background-color: rgb(64, 39, 5);
        font-size: 50px;
        text-align: center;
        border: 10px dotted red;
        padding: 50px;
        box-sizing: content-box;
      }
      #containt2 {
        width: 250px;
        height: 250px;
        background-color: rgb(121, 141, 160);
        font-size: 50px;
        text-align: center;
        border: 10px dotted red;
        padding: 50px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="containt1">containt1</div>
      <div id="containt2">containt2</div>
    </div>
  </body>
</html>
