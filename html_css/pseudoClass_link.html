<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* LoVe HAte */
      a:link {
        color: rgb(139, 158, 158);
        background-color: rgb(222, 196, 158);
        text-decoration: none;
        font-size: 25px;
        font-weight: bolder;
        border: 2px solid black;
        border-radius: 10px;
        padding: 5px;
        display: block;
        width: 50px;
      }
      a:visited {
        color: rgb(139, 158, 158);
        background-color: rgb(75, 47, 5);
        text-decoration: none;
        font-size: 25px;
        font-weight: bolder;
        border: 2px solid black;
        border-radius: 10px;
        padding: 5px;
        display: block;
        width: 50px;
      }
      a:hover {
        color: rgb(139, 158, 158);
        background-color: rgb(67, 42, 6);
        text-decoration: none;
        font-size: 25px;
        font-weight: bolder;
        border: 2px solid black;
        border-radius: 10px;
        padding: 5px;
        display: block;
        width: 70px;
      }
      a:active {
        color: rgb(10, 82, 82);
        background-color: rgb(222, 196, 158);
        text-decoration: none;
        font-size: 25px;
        font-weight: bolder;
        border: 2px solid black;
        border-radius: 10px;
        padding: 5px;
        display: block;
        width: 70px;
      }
    </style>
  </head>
  <body>
    <a href="images/img.jpg">click</a>
  </body>
</html>
