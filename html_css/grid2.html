<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      #container {
        width: 450px;
        height: 450px;
        background-color: rgb(209, 128, 30);
        margin: 20px;
        display: grid;
        gap: 2px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
      .item {
        background-color: rgb(139, 103, 60);
        margin: 10px;
        padding: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: black;
        font-weight: bold;
        border: 1px solid black;
        border-radius: 8px;
      }
      #item1 {
        grid-row-start: 3;
        grid-row-end: 4;
        grid-column-start: 3;
        grid-column-end: 4;
      }
      #item6 {
        grid-row: 3/4;
        grid-column: 2/3;
      }
      #item4 {
        grid-row: 2/3;
        grid-column: 3/4;
      }
      #item8 {
        grid-row: 1/2;
        grid-column: 3/4;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="item" id="item1">item1</div>
      <div class="item" id="item2">item2</div>
      <div class="item" id="item3">item3</div>
      <div class="item" id="item4">item4</div>
      <div class="item" id="item5">item5</div>
      <div class="item" id="item6">item6</div>
      <div class="item" id="item7">item7</div>
      <div class="item" id="item8">item8</div>
      <div class="item" id="item9">item9</div>
    </div>
    <wa-icon variant="regular" name="house"></wa-icon>
  </body>
</html>
